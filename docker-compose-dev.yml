version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: memora-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-memora_root_pass}
      MYSQL_DATABASE: personal_knowledgebase
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - memora-network

  qdrant:
    image: qdrant/qdrant
    container_name: memora-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - memora-network

  memora:
    build: .
    container_name: memora-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=mysql+pymysql://root:${MYSQL_PASSWORD:-memora_root_pass}@mysql:3306/personal_knowledgebase
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6334
      - LLM_API_BASE=${LLM_API_BASE:-https://api.deepseek.com/v1}
      - LLM_API_KEY=${LLM_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - mysql
      - qdrant
    networks:
      - memora-network

volumes:
  mysql_data:
  qdrant_data:

networks:
  memora-network:
    driver: bridge
