version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: memora-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-memora_root_pass}
      MYSQL_DATABASE: personal_knowledgebase
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - memora-network

  qdrant:
    image: qdrant/qdrant
    container_name: memora-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - memora-network

  neo4j:
    image: neo4j:5-community
    container_name: memora-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-memora_neo4j_pass}
      NEO4J_PLUGINS: '[]'
      NEO4J_server_memory_pagecache_size: 128M
      NEO4J_server_memory_heap_initial__size: 256M
      NEO4J_server_memory_heap_max__size: 512M
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - memora-network

  memora:
    build: .
    container_name: memora-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=mysql+pymysql://root:${MYSQL_PASSWORD:-memora_root_pass}@mysql:3306/personal_knowledgebase
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6334
      - LLM_API_BASE=${LLM_API_BASE:-https://api.deepseek.com/v1}
      - LLM_API_KEY=${LLM_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-memora_neo4j_pass}
      - NEO4J_ENABLED=${NEO4J_ENABLED:-true}
    depends_on:
      - mysql
      - qdrant
      - neo4j
    networks:
      - memora-network

volumes:
  mysql_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:

networks:
  memora-network:
    driver: bridge
