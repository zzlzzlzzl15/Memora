version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: memora-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: personal_knowledgebase
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: memora-qdrant
    restart: always
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: memora-neo4j
    restart: always
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme}
      NEO4J_PLUGINS: '[]'
      NEO4J_server_memory_pagecache_size: 128M
      NEO4J_server_memory_heap_initial__size: 256M
      NEO4J_server_memory_heap_max__size: 512M
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'echo > /dev/tcp/localhost/7474' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: memora-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: memora-app
    restart: always
    env_file:
      - .env.production
    ports:
      - "8000:8080"  # 直接暴露8000端口,无需Nginx
    volumes:
      - ./static:/app/static  # 挂载静态文件,开发时修改立即生效
      - app_uploads:/app/uploads
      - app_logs:/app/logs
      - hf_cache:/app/huggingface_cache
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_started
      redis:
        condition: service_healthy

  # Nginx反向代理 - 开发环境可选,生产环境推荐
  # nginx:
  #   image: nginx:alpine
  #   container_name: memora-nginx
  #   restart: always
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/conf.d:/etc/nginx/conf.d:ro
  #     - certbot_etc:/etc/letsencrypt
  #     - certbot_var:/var/lib/letsencrypt
  #     - certbot_www:/var/www/certbot
  #   depends_on:
  #     - app

  # Certbot SSL证书管理 - 仅生产环境需要
  # certbot:
  #   image: certbot/certbot
  #   container_name: memora-certbot
  #   volumes:
  #     - certbot_etc:/etc/letsencrypt
  #     - certbot_var:/var/lib/letsencrypt
  #     - certbot_www:/var/www/certbot

volumes:
  mysql_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  app_uploads:
  app_logs:
  hf_cache:
  certbot_etc:
  certbot_var:
  certbot_www:
